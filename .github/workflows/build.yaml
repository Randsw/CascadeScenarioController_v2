name: Build and Push
on:
  push:
    tags:
        - '*.*.*'
permissions:
    contents: write
    packages: write
jobs:
    Deploy:
      # The type of runner that the job will run on
      runs-on: ubuntu-latest
      steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/randsw/cascadescenariocontroller-auto
          flavor: latest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
      - name: Collect build metadata
        id: build_meta
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Github Packages
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image and push to GitHub Container Registry
        uses: docker/build-push-action@v7
        with:
          # relative path to the place where source code with Dockerfile is located
          context: .
          # Note: tags has to be all lower-case
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The controller is deployed on both amd64 and arm64 nodes.
          platforms: linux/amd64,linux/arm64
          # Build metadata is passed in as build-args because .git is excluded
          # from the build context, so the Makefile cannot derive it itself.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.build_meta.outputs.commit }}
            DATE=${{ steps.build_meta.outputs.date }}
          # Persistent layer caching keeps repeated tag builds fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
    Release:
        needs: Deploy
        name: "Release"
        runs-on: "ubuntu-latest"
        steps:
        - name: Config Git # https://github.com/rickstaa/action-contains-tag/pull/18
          run: git config --global remote.origin.followRemoteHEAD never
        - name: Checkout
          uses: actions/checkout@v7
          with:
            fetch-depth: 0
        - name: Check if tag belong to commit in main branch
          uses: rickstaa/action-contains-tag@v1
          id: contains_tag_main
          with:
            reference: "main"
            tag: "${{ github.ref }}"
        - name: Check if tag belong to commit in develop branch
          uses: rickstaa/action-contains-tag@v1
          id: contains_tag_develop
          with:
            reference: "develop"
            tag: "${{ github.ref }}"
        - name: Release
          uses: softprops/action-gh-release@v3
          with:
            generate_release_notes: true
          if: ${{ steps.contains_tag_main.outputs.retval == 'true'}}
        - name: Pre-Release
          uses: softprops/action-gh-release@v3
          with:
            prerelease: true
            generate_release_notes: true
          if: ${{ steps.contains_tag_develop.outputs.retval == 'true'}}
